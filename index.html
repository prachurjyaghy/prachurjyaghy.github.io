<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prachurjya Sharma | Interactive Physical Design & VLSI Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060911;
      --surface: #0f1626;
      --surface-hover: #17223b;
      --border: #1e2d4a;
      --cyan: #00f0ff;
      --blue: #3b82f6;
      --emerald: #10b981;
      --amber: #f59e0b;
      --purple: #8b5cf6;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(0, 240, 255, 0.08), transparent 35%),
        radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 40%),
        linear-gradient(rgba(30, 45, 74, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 45, 74, 0.18) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Navbar */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 9, 17, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--cyan);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: 0.2s;
    }
    .nav-links a:hover { color: var(--cyan); }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hero Section */
    .hero {
      padding: 72px 0 56px;
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 36px;
      align-items: center;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--emerald);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #ffffff, #93c5fd, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: var(--muted);
      font-size: 1.08rem;
      margin-bottom: 28px;
      max-width: 640px;
    }
    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }
    .btn {
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      cursor: pointer;
      transition: 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #050811;
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.25);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0, 240, 255, 0.4); }
    .btn-outline {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--cyan); color: var(--cyan); }

    /* Hero Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      transition: 0.25s;
    }
    .stat-card:hover { border-color: var(--cyan); transform: translateY(-3px); }
    .stat-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--cyan);
    }
