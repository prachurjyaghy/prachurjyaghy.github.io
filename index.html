<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prachurjya Sharma | Visual Data Model Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050811;
      --panel-bg: #0b1120;
      --cyan: #00f0ff;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --emerald: #10b981;
      --border: #1e2d4a;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* CSS Grid background pattern */
    .bg-grid {
      position: absolute;
      width: 100%; height: 100%; z-index: 0;
      background-image: 
        linear-gradient(rgba(30, 45, 74, 0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 45, 74, 0.3) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Layout Split */
    .canvas-container {
      flex: 1;
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .sidebar {
      width: 420px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      z-index: 2;
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }

    /* SVG Canvas Styles */
    svg {
      width: 100%;
      height: 100%;
      max-width: 1200px;
      max-height: 900px;
    }

    /* Orthogonal Data Traces */
    .data-trace {
      stroke: var(--border);
      stroke-width: 2;
      fill: none;
    }
    .data-flow {
      stroke: var(--cyan);
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 8 16;
      animation: flow-anim 1.5s linear infinite;
      opacity: 0.6;
    }
    .data-flow.purple { stroke: var(--purple); }
    .data-flow.emerald { stroke: var(--emerald); }

    @keyframes flow-anim {
      to { stroke-dashoffset: -24; }
    }

    /* Interactive Data Nodes */
    .node-group { cursor: pointer; transition: 0.3s; }
    
    .node-bg {
      fill: #0d1527;
      stroke: #1e2d4a;
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    
    .node-group:hover .node-bg, .node-group.active .node-bg {
      fill: #162340;
      stroke: var(--cyan);
      stroke-width: 3;
      filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
    }

    .node-group.software:hover .node-bg, .node-group.software.active .node-bg {
      stroke: var(--purple);
      filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.4));
    }

    /* Typography inside SVG */
    .node-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      fill: var(--text);
      text-anchor: middle;
      pointer-events: none;
    }
    .node-sub {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      fill: var(--muted);
      text-anchor: middle;
      pointer-events: none;
    }

    /* Sidebar Telemetry UI */
    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 240, 255, 0.03);
    }
    .sys-status {
      font-family: 'JetBrains Mono', monospace;
      color: var(--cyan);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sys-dot { width: 8px; height: 8px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 8px var(--cyan); animation: pulse 2s infinite; }
    
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .sidebar-title { font-size: 1.6rem; font-weight: 600; margin-bottom: 6px; }
    .sidebar-org { color: var(--muted); font-size: 0.95rem; }

    .sidebar-content {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .t-box {
      background: #111a2f;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
    }
    .t-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
    .t-value { font-size: 1rem; color: var(--cyan); font-weight: 600; font-family: 'JetBrains Mono', monospace; }

    .data-list { list-style: none; margin-bottom: 24px; }
    .data-list li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 12px;
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .data-list li::before {
      content: '▹';
      position: absolute;
      left: 0; top: 0;
      color: var(--cyan);
      font-size: 1.2rem;
    }

    .tech-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <!-- Left Canvas: The Graphic Data Model -->
  <div class="canvas-container">
    <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet">
      
      <!-- Orthogonal Routing Traces (Base Lines) -->
      <path class="data-trace" d="M500,400 L500,165 L270,165" />
      <path class="data-trace" d="M500,400 L500,165 L730,165" />
      <path class="data-trace" d="M350,400 L250,400" />
      <path class="data-trace" d="M650,400 L750,400" />
      <path class="data-trace" d="M500,400 L500,635 L270,635" />
      <path class="data-trace" d="M500,400 L500,635 L730,635" />

      <!-- Glowing Animated Flow Traces -->
      <path class="data-flow" d="M500,400 L500,165 L270,165" />
      <path class="data-flow" d="M500,400 L500,165 L730,165" />
      <path class="data-flow" d="M350,400 L250,400" />
      <path class="data-flow purple" d="M650,400 L750,400" />
      <path class="data-flow purple" d="M500,400 L500,635 L270,635" />
      <path class="data-flow emerald" d="M500,400 L500,635 L730,635" />

      <!-- Center Hub -->
      <g class="node-group active" id="node-hub" onclick="loadData('hub')">
        <rect x="350" y="350" width="300" height="100" rx="12" class="node-bg" style="fill:#0f172a;" />
        <text x="500" y="395" class="node-title" style="font-size:20px; fill:var(--cyan);">Prachurjya Sharma</text>

      </g>

      <!-- Node 1: 6nm Network -->
      <g class="node-group" id="node-6nm" onclick="loadData('6nm')">
        <rect x="50" y="120" width="220" height="90" rx="8" class="node-bg" />

        <text x="160" y="185" class="node-sub">MediaTek • 3.4M Inst</text>
      </g>

      <!-- Node 2: 7nm Wi-Fi -->
      <g class="node-group" id="node-7nm" onclick="loadData('7nm')">
        <rect x="730" y="120" width="220" height="90" rx="8" class="node-bg" />

        <text x="840" y="185" class="node-sub">MediaTek • 1.25 GHz</text>
      </g>

      <!-- Node 3: 12nm/22nm Base -->
      <g class="node-group" id="node-base" onclick="loadData('base')">
        <rect x="30" y="355" width="220" height="90" rx="8" class="node-bg" />
        <text x="140" y="395" class="node-title">Legacy & Full-Chip</text>
        <text x="140" y="420" class="node-sub">12nm TV & 22nm Satellite</text>
      </g>

      <!-- Node 4: Automation -->
      <g class="node-group software" id="node-auto" onclick="loadData('auto')">
        <rect x="750" y="355" width="220" height="90" rx="8" class="node-bg" />
        <text x="860" y="395" class="node-title">EDA Automation</text>
        <text x="860" y="420" class="node-sub">TCL • Perl • Custom DRCs</text>
      </g>

      <!-- Node 5: Cloud/Software -->
      <g class="node-group software" id="node-soft" onclick="loadData('soft')">
        <rect x="50" y="590" width="220" height="90" rx="8" class="node-bg" />
        <text x="160" y="630" class="node-title">Cloud & Software</text>
        <text x="160" y="655" class="node-sub">C# • Azure @ KPIT</text>
      </g>

      <!-- Node 6: Open Source VLSI -->
      <g class="node-group" id="node-open" onclick="loadData('open')">
        <rect x="730" y="590" width="220" height="90" rx="8" class="node-bg" />
        <text x="840" y="630" class="node-title">Open-Source VLSI</text>
        <text x="840" y="655" class="node-sub">SKY130 PDK • OpenLane</text>
      </g>
    </svg>
  </div>

  <!-- Right Sidebar: Telemetry Inspector -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sys-status"><div class="sys-dot"></div> Data Link Active</div>
      <h2 class="sidebar-title" id="side-title">Prachurjya Sharma</h2>
      <div class="sidebar-org" id="side-org">Physical Design Engineer @ Quest Global</div>
    </div>
    <div class="sidebar-content">
      
      <div class="telemetry-grid" id="side-metrics">
        <!-- Injected via JS -->
      </div>

      <div style="font-family:'JetBrains Mono', monospace; font-size:0.8rem; color:var(--muted); margin-bottom:12px; letter-spacing:1px;">/// ARCHITECTURE & EXECUTION ///</div>
      <ul class="data-list" id="side-bullets">
        <!-- Injected via JS -->
      </ul>

      <div style="font-family:'JetBrains Mono', monospace; font-size:0.8rem; color:var(--muted); margin-bottom:12px; letter-spacing:1px;">/// TECHNICAL STACK ///</div>
      <div class="tech-tags" id="side-tags">
        <!-- Injected via JS -->
      </div>
      
      <!-- Permanent Contact Links -->
      <div style="margin-top: 40px; border-top: 1px solid var(--border); padding-top: 20px; font-size: 0.85rem;">
        <a href="https://github.com/prachurjyaghy" target="_blank" style="color:var(--cyan); text-decoration:none; margin-right: 15px;">[ GitHub ↗ ]</a>
        <a href="https://www.linkedin.com/in/prachurjya-sharma-04/" target="_blank" style="color:var(--cyan); text-decoration:none; margin-right: 15px;">[ LinkedIn ↗ ]</a>
        <a href="mailto:prachurjyaraj@hotmail.com" style="color:var(--cyan); text-decoration:none;">[ Email ↗ ]</a>
      </div>
    </div>
  </div>

      },
      "7nm": {

        metrics: [

          { label: "INSTANCES", val: "3.0 Million" },
          { label: "MACROS", val: "87" },

        ],

          "Implemented complex Mesh Clock Tree Synthesis (CTS) and balanced clock latency for strict hold timing closure.",

        ],
        tags: ["7nm FinFET", "1.25 GHz Mesh CTS", "Clock Latency", "TCL Automation", "Setup/Hold Closure"]
      },

    };

    function loadData(nodeId) {
      // Update active SVG node highlight
      document.querySelectorAll('.node-group').forEach(el => el.classList.remove('active'));
      document.getElementById('node-' + nodeId).classList.add('active');

      // Fetch data
      const data = dataModel[nodeId];

      // Update Sidebar UI
      document.getElementById('side-title').innerText = data.title;
      document.getElementById('side-org').innerText = data.org;

      // Populate Metrics Grid
      const metricsHtml = data.metrics.map(m => `
        <div class="t-box">
          <div class="t-label">${m.label}</div>
          <div class="t-value">${m.val}</div>
        </div>
      `).join('');
      document.getElementById('side-metrics').innerHTML = metricsHtml;

      // Populate Bullets
      const bulletsHtml = data.bullets.map(b => `<li>${b}</li>`).join('');
      document.getElementById('side-bullets').innerHTML = bulletsHtml;

      // Populate Tags
      const tagsHtml = data.tags.map(t => `<div class="tag">${t}</div>`).join('');
      document.getElementById('side-tags').innerHTML = tagsHtml;
    }

    // Load Hub data on startup
    loadData('hub');
  </script>
</body>
</html>
